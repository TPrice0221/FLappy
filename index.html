<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT RUNNER | FLIGHT SYNC</title>
    <style>
        :root { --fl-orange: #ff8c00; --fl-bg: #2c3033; --fl-panel: #1e2225; --clipping: #ff4c4c; --vst-gold: #ffd700; }
        body { margin: 0; overflow: hidden; background: #121314; font-family: sans-serif; color: white; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: var(--fl-bg); border: 8px solid var(--fl-panel); display: none; border-radius: 4px; }
        #ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: none; background: #111; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--fl-orange); color: var(--fl-orange); font-weight: bold; text-align: center; z-index: 20; }
        #menu, #end-screen { text-align: center; z-index: 10; background: var(--fl-panel); padding: 50px; border-radius: 12px; border: 1px solid #444; min-width: 400px; }
        h1 { color: var(--fl-orange); font-style: italic; }
        button { padding: 12px 35px; background: #3b3f43; color: white; border: 1px solid #555; cursor: pointer; font-weight: bold; text-transform: uppercase; margin: 10px; }
        button:hover { background: var(--fl-orange); color: #000; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>GAIN STAGE</h1>
        <p>POWERED BY PRODUCERS v2.0.2</p>
        <button onclick="startGame()">RENDER PROJECT</button>
    </div>

    <div id="ui">
        PEAK: <span id="score">0</span> dB | PLUGINS: <span id="pluginCount">0/0</span>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="end-screen" style="display:none;">
        <h1 id="status-message">PROJECT CRASHED</h1>
        <p>FINAL SCORE: <span id="finalScore">0</span></p>
        <p>PLUGINS: <span id="finalPlugins">0/0</span></p>
        <button onclick="startGame()" style="background: var(--fl-orange); color: black;">RE-MIX</button>
    </div>
</div>

<audio id="bgm" src="track.mp3"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgm = document.getElementById('bgm');
    
    let score = 0, gameActive = false, obstacles = [], coins = [], lastSpawnTime = 0, animationId = null;
    let pluginsSpawned = 0, pluginsCollected = 0, waveOffset = 0;

    const player = { x: 150, y: 225, width: 32, height: 36, dy: 0, gravity: 0.35, lift: -7 };

    function initCanvas() {
        canvas.width = 850;
        canvas.height = 500;
        player.y = canvas.height / 2;
        player.dy = 0;
    }

    function startGame() {
        if (animationId) cancelAnimationFrame(animationId);
        
        // Reset Variables
        score = 0; obstacles = []; coins = []; 
        pluginsSpawned = 0; pluginsCollected = 0;
        lastSpawnTime = Date.now(); waveOffset = 0;
        gameActive = true;

        // UI
        document.getElementById('menu').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        
        initCanvas();

        // THE EXACT AUDIO TRIGGER
        bgm.currentTime = 0;
        bgm.play().catch(() => console.log("Audio Blocked"));

        update(); 
    }

    function spawnGate() {
        const gap = 180;
        const topH = Math.random() * (canvas.height - gap - 100) + 50;
        obstacles.push({ x: canvas.width, y: 0, w: 40, h: topH, passed: false });
        obstacles.push({ x: canvas.width, y: topH + gap, w: 40, h: canvas.height - (topH + gap), passed: false });
        coins.push({ x: canvas.width + 12, y: topH + (gap/2) - 8, size: 16, collected: false });
        pluginsSpawned++;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;
    }

    function update() {
        if (!gameActive) return;

        if (Date.now() - lastSpawnTime > 1800) {
            spawnGate();
            lastSpawnTime = Date.now();
        }

        player.dy += player.gravity;
        player.y += player.dy;
        waveOffset += 5;

        if (player.y < 0 || player.y + player.height > canvas.height) endGame("CLIPPING (CRASHED)");

        obstacles.forEach(obs => {
            obs.x -= 5;
            if (player.x < obs.x + obs.w && player.x + player.width > obs.x &&
                player.y < obs.y + obs.h && player.y + player.height > obs.y) {
                endGame("PROJECT CRASHED");
            }
            if (!obs.passed && obs.x < player.x) { obs.passed = true; score += 100; }
        });

        coins.forEach((c, i) => {
            c.x -= 5;
            if (!c.collected && player.x < c.x + c.size && player.x + player.width > c.x &&
                player.y < c.y + c.size && player.y + player.height > c.y) {
                c.collected = true; score += 1000; pluginsCollected++;
                coins.splice(i, 1);
            }
        });

        document.getElementById('score').innerText = score;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Grid
        ctx.strokeStyle = '#333';
        for(let i = -(waveOffset % 80); i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        // Coins
        ctx.fillStyle = "#ffd700";
        coins.forEach(c => ctx.fillRect(c.x, c.y, c.size, c.size));

        // Player
        ctx.fillStyle = "#ff8c00";
        ctx.fillRect(player.x, player.y, player.width, player.height);

        // Obstacles
        ctx.fillStyle = "#ff4c4c";
        obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));
    }

    function endGame(msg) {
        gameActive = false;
        bgm.pause();
        document.getElementById('status-message').innerText = msg;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalPlugins').innerText = `${pluginsCollected}/${pluginsSpawned}`;
        document.getElementById('end-screen').style.display = 'block';
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (gameActive) player.dy = player.lift;
            e.preventDefault();
        }
    });
</script>
</body>
</html>
