<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT RUNNER | AUTOMATION FLIGHT</title>
    <style>
        :root {
            --fl-orange: #ff8c00;
            --fl-bg: #2c3033;
            --fl-panel: #1e2225;
            --clipping: #ff4c4c;
            --vst-gold: #ffd700;
        }

        body { margin: 0; overflow: hidden; background: #121314; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { background: var(--fl-bg); border: 8px solid var(--fl-panel); border-top: 25px solid var(--fl-panel); display: none; box-shadow: 0 30px 60px rgba(0,0,0,0.7); border-radius: 4px; }
        #ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; display: none; background: #111; padding: 5px 20px; border-radius: 20px; border: 1px solid var(--fl-orange); color: var(--fl-orange); font-weight: bold; text-align: center; z-index: 20; }
        #menu, #end-screen { text-align: center; z-index: 10; background: var(--fl-panel); padding: 50px; border-radius: 12px; border: 1px solid #444; min-width: 400px; }
        h1 { color: var(--fl-orange); text-transform: uppercase; letter-spacing: 5px; font-style: italic; }
        .stat-box { background: #111; padding: 20px; border-radius: 8px; margin: 15px 0; border-top: 2px solid var(--fl-orange); }
        button { padding: 12px 35px; background: #3b3f43; color: white; border: 1px solid #555; border-radius: 3px; font-weight: bold; cursor: pointer; margin: 10px; text-transform: uppercase; }
        button:hover { background: var(--fl-orange); color: #000; }
        input { padding: 12px; background: #000; border: 1px solid #333; color: var(--fl-orange); text-align: center; margin-bottom: 15px; width: 200px; font-family: monospace; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>GAIN STAGE</h1>
        <p>POWERED BY PRODUCERS v2.0.1 (FLIGHT)</p>
        <button onclick="startGame()">RENDER PROJECT</button>
    </div>

    <div id="ui">
        MASTER OUTPUT: <span id="score">0</span> dB<br>
        <small style="color: var(--vst-gold);">PLUGINS LOADED: <span id="pluginCount">0/0</span></small>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="end-screen" style="display:none;">
        <h1 id="status-message">PROJECT CRASHED</h1>
        <div id="score-submission">
            <div class="stat-box">
                <p id="final-stats" style="font-size: 20px; margin: 5px 0;">FINAL PEAK: <span id="finalScore">0</span></p>
                <p style="font-size: 18px; color: var(--vst-gold); margin: 10px 0;">PLUGINS ACQUIRED: <span id="finalPlugins">0 / 0</span></p>
            </div>
            <input type="text" id="playerName" placeholder="PRODUCER_NAME">
            <br>
            <button onclick="saveScore()">EXPORT TO CLOUD</button>
        </div>
        <div id="leaderboard-section" style="margin-top: 20px; display:none;">
            <h3>TOP PRODUCERS</h3>
            <ul id="leaderboard-list" style="list-style: none; padding: 0; color: var(--fl-orange); font-family: monospace;"></ul>
            <button onclick="backToMenu()">EXIT</button>
        </div>
        <button id="quick-play-btn" onclick="startGame()" style="background: var(--fl-orange); color: black;">RE-MIX</button>
    </div>
</div>

<audio id="bgm" src="track.mp3"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgm = document.getElementById('bgm');
    
    const OBSTACLE_SPEED = 5; 
    const SPAWN_INTERVAL = 1800; 
    const GATE_GAP = 185; 

    let score = 0, gameActive = false, obstacles = [], coins = [], floatingTexts = [];
    let pluginsSpawned = 0, pluginsCollected = 0;
    let lastSpawnTime = 0, animationId = null;
    let waveOffset = 0, gameStartTime = 0;
    
    const FEEDBACK_WORDS = ["SIDECHAINED", "PROCESSED", "QUANTIZED", "LIMITING", "NORMALIZED", "SAMPLING"];

    const player = {
        x: 150, y: 225, width: 32, height: 36,
        dy: 0, gravity: 0.35, lift: -7
    };

    function initCanvas() {
        canvas.width = 850;
        canvas.height = 500;
        player.y = canvas.height / 2;
        player.dy = 0;
    }

    function spawnGate() {
        const minGateHeight = 50;
        const maxGateHeight = canvas.height - GATE_GAP - minGateHeight;
        const topHeight = Math.floor(Math.random() * (maxGateHeight - minGateHeight + 1)) + minGateHeight;

        obstacles.push({ x: canvas.width, y: 0, width: 40, height: topHeight, passed: false, type: 'top' });
        obstacles.push({ x: canvas.width, y: topHeight + GATE_GAP, width: 40, height: canvas.height - (topHeight + GATE_GAP), passed: false, type: 'bottom' });

        coins.push({ x: canvas.width + 12, y: topHeight + (GATE_GAP/2) - 8, size: 16, collected: false });
        pluginsSpawned++;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;
    }

    function update() {
        if (!gameActive) return;

        let now = Date.now();
        if (now - lastSpawnTime > SPAWN_INTERVAL) {
            spawnGate();
            lastSpawnTime = now;
        }

        player.dy += player.gravity;
        player.y += player.dy;
        waveOffset += OBSTACLE_SPEED;

        if (player.y < 0 || player.y + player.height > canvas.height) {
            endGame("PROJECT CRASHED");
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= OBSTACLE_SPEED;

            if (player.x + 4 < obs.x + obs.width && player.x + player.width - 4 > obs.x &&
                player.y + 4 < obs.y + obs.height && player.y + player.height - 4 > obs.y) {
                endGame("PROJECT CRASHED");
            }

            if (!obs.passed && obs.x < player.x && obs.type === 'top') {
                obs.passed = true;
                score += 100;
                updateUI();
                floatingTexts.push({ x: player.x, y: player.y - 20, text: FEEDBACK_WORDS[Math.floor(Math.random() * FEEDBACK_WORDS.length)], life: 1.0 });
            }
            if (obs.x + obs.width < -50) obstacles.splice(i, 1);
        }

        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.x -= OBSTACLE_SPEED;

            if (!c.collected && 
                player.x < c.x + c.size && player.x + player.width > c.x &&
                player.y < c.y + c.size && player.y + player.height > c.y) {
                c.collected = true;
                score += 1000;
                pluginsCollected++;
                updateUI();
                floatingTexts.push({ x: player.x, y: player.y - 10, text: "PLUG-IN OPENED", life: 1.0 });
                coins.splice(i, 1);
            }
            if (c.x < -50) coins.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 1;
            floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#3d4144'; ctx.lineWidth = 1;
        for(let i = -(waveOffset % 80); i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        coins.forEach(c => {
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.moveTo(c.x + c.size/2, c.y);
            ctx.lineTo(c.x + c.size, c.y + c.size/2);
            ctx.lineTo(c.x + c.size/2, c.y + c.size);
            ctx.lineTo(c.x, c.y + c.size/2);
            ctx.fill();
        });

        ctx.save();
        ctx.translate(player.x + 16, player.y + 18);
        ctx.rotate(player.dy * 0.05);
        ctx.fillStyle = "#ff8c00"; ctx.beginPath();
        ctx.ellipse(0, 0, 16, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4caf50"; ctx.beginPath();
        ctx.ellipse(5, -14, 9, 4, -0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        obstacles.forEach(obs => {
            ctx.fillStyle = "#111"; 
            ctx.fillRect(obs.x + 15, obs.y, 10, obs.height);
            ctx.fillStyle = "#ff4c4c"; 
            const knobY = (obs.type === 'top') ? obs.height - 20 : obs.y;
            ctx.fillRect(obs.x, knobY, obs.width, 20);
        });

        floatingTexts.forEach(ft => {
            ctx.font = "bold 13px 'Segoe UI'";
            ctx.fillStyle = ft.text === "PLUG-IN OPENED" ? "#ffd700" : "white";
            ctx.fillText(ft.text, ft.x, ft.y);
        });
    }

    function startGame() {
        if (animationId) cancelAnimationFrame(animationId);
        score = 0; obstacles = []; coins = []; floatingTexts = []; 
        pluginsSpawned = 0; pluginsCollected = 0;
        lastSpawnTime = Date.now(); waveOffset = 0;
        gameActive = true;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        updateUI();
        initCanvas();
        bgm.currentTime = 0;
        bgm.play().catch(() => {});
        update(); 
    }

    function endGame(msg) {
        gameActive = false; bgm.pause();
        const statusHeading = document.getElementById('status-message');
        statusHeading.innerText = msg;
        statusHeading.style.color = msg === "TRACK RENDERED" ? "var(--fl-orange)" : "var(--clipping)";
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalPlugins').innerText = `${pluginsCollected} / ${pluginsSpawned}`;
        document.getElementById('end-screen').style.display = 'block';
    }

    function saveScore() {
        const name = document.getElementById('playerName').value || "PRODUCER";
        let board = JSON.parse(localStorage.getItem('beatRunnerScores')) || [];
        board.push({ name: name, score: score });
        board.sort((a,b) => b.score - a.score);
        localStorage.setItem('beatRunnerScores', JSON.stringify(board.slice(0,5)));
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = board.slice(0,5).map(e => `<li>${e.name.toUpperCase()} >> ${e.score} PEAK</li>`).join('');
        document.getElementById('score-submission').style.display = 'none';
        document.getElementById('leaderboard-section').style.display = 'block';
    }

    function backToMenu() { 
        document.getElementById('end-screen').style.display = 'none'; 
        canvas.style.display = 'none'; 
        document.getElementById('menu').style.display = 'block'; 
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (gameActive) player.dy = player.lift;
            e.preventDefault();
        }
    });
</script>
</body>
</html>
