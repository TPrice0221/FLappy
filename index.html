<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEAT RUNNER | MOBILE FLIGHT</title>
    <style>
        :root {
            --fl-orange: #ff8c00;
            --fl-bg: #2c3033;
            --fl-panel: #1e2225;
            --clipping: #ff4c4c;
            --vst-gold: #ffd700;
        }

        /* Prevent mobile scrolling/bouncing */
        * { touch-action: manipulation; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #121314; 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
            position: fixed; 
            width: 100%; 
            height: 100%;
        }

        #game-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        canvas { 
            background: var(--fl-bg); 
            display: none; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #ui { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 12px; 
            display: none; 
            background: rgba(17, 17, 17, 0.9); 
            padding: 8px 15px; 
            border-radius: 15px; 
            border: 1px solid var(--fl-orange); 
            color: var(--fl-orange); 
            text-align: center; 
            z-index: 20;
            pointer-events: none;
        }

        #menu, #end-screen { 
            text-align: center; 
            z-index: 10; 
            background: var(--fl-panel); 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #444; 
            width: 80%;
            max-width: 400px;
        }

        h1 { color: var(--fl-orange); font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }
        .stat-box { background: #111; padding: 15px; border-radius: 8px; margin: 10px 0; border-top: 2px solid var(--fl-orange); }
        
        button { 
            padding: 15px 30px; 
            background: #3b3f43; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
            margin: 10px; 
            text-transform: uppercase; 
            width: 100%;
        }
        
        button:active { background: var(--fl-orange); color: #000; }
        input { padding: 12px; background: #000; border: 1px solid #333; color: var(--fl-orange); text-align: center; margin-bottom: 10px; width: 90%; font-family: monospace; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>GAIN STAGE</h1>
        <p>POWERED BY PRODUCERS v2.1</p>
        <button onclick="startGame()">TAP TO RENDER</button>
    </div>

    <div id="ui">
        MASTER OUTPUT: <span id="score">0</span> dB<br>
        <small style="color: var(--vst-gold);">PLUGINS LOADED: <span id="pluginCount">0/0</span></small>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="end-screen" style="display:none;">
        <h1 id="status-message">PROJECT CRASHED</h1>
        <div id="score-submission">
            <div class="stat-box">
                <p id="final-stats">PEAK: <span id="finalScore">0</span></p>
                <p style="color: var(--vst-gold);">PLUGINS: <span id="finalPlugins">0 / 0</span></p>
            </div>
            <input type="text" id="playerName" placeholder="PRODUCER_NAME">
            <button onclick="saveScore()">EXPORT TO CLOUD</button>
        </div>
        <button id="quick-play-btn" onclick="startGame()" style="background: var(--fl-orange); color: black;">RE-MIX</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let OBSTACLE_SPEED = 4; 
    let SPAWN_INTERVAL = 1500; 
    let GATE_GAP = 160; 

    let score = 0, gameActive = false, obstacles = [], coins = [], floatingTexts = [];
    let pluginsSpawned = 0, pluginsCollected = 0;
    let lastSpawnTime = 0, animationId = null;
    let waveOffset = 0;
    
    const FEEDBACK_WORDS = ["SIDECHAINED", "PROCESSED", "QUANTIZED", "LIMITING", "NORMALIZED"];

    const player = {
        x: 60, y: 0, width: 30, height: 35,
        dy: 0, gravity: 0.3, lift: -6
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Adjust mechanics for mobile height
        GATE_GAP = canvas.height * 0.3; 
        player.x = canvas.width * 0.15;
    }

    function spawnGate() {
        const minGateHeight = 60;
        const maxGateHeight = canvas.height - GATE_GAP - minGateHeight;
        const topHeight = Math.floor(Math.random() * (maxGateHeight - minGateHeight + 1)) + minGateHeight;

        obstacles.push({ x: canvas.width, y: 0, width: 45, height: topHeight, passed: false, type: 'top' });
        obstacles.push({ x: canvas.width, y: topHeight + GATE_GAP, width: 45, height: canvas.height - (topHeight + GATE_GAP), passed: false, type: 'bottom' });

        coins.push({ x: canvas.width + 15, y: topHeight + (GATE_GAP/2) - 8, size: 18, collected: false });
        pluginsSpawned++;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;
    }

    function update() {
        if (!gameActive) return;

        let now = Date.now();
        if (now - lastSpawnTime > SPAWN_INTERVAL) {
            spawnGate();
            lastSpawnTime = now;
        }

        player.dy += player.gravity;
        player.y += player.dy;
        waveOffset += OBSTACLE_SPEED;

        // Boundary Check
        if (player.y < 0 || player.y + player.height > canvas.height) {
            endGame("PROJECT CRASHED");
        }

        // Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= OBSTACLE_SPEED;

            if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                endGame("PROJECT CRASHED");
            }

            if (!obs.passed && obs.x < player.x && obs.type === 'top') {
                obs.passed = true;
                score += 100;
                updateUI();
            }
            if (obs.x + obs.width < -50) obstacles.splice(i, 1);
        }

        // Plugins
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.x -= OBSTACLE_SPEED;
            if (!c.collected && player.x < c.x + c.size && player.x + player.width > c.x &&
                player.y < c.y + c.size && player.y + player.height > c.y) {
                c.collected = true;
                score += 1000;
                pluginsCollected++;
                updateUI();
                coins.splice(i, 1);
            }
            if (c.x < -50) coins.splice(i, 1);
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Grid
        ctx.strokeStyle = '#3d4144'; ctx.lineWidth = 1;
        for(let i = -(waveOffset % 60); i < canvas.width; i += 60) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        // VSTs
        coins.forEach(c => {
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.moveTo(c.x + c.size/2, c.y);
            ctx.lineTo(c.x + c.size, c.y + c.size/2);
            ctx.lineTo(c.x + c.size/2, c.y + c.size);
            ctx.lineTo(c.x, c.y + c.size/2);
            ctx.fill();
        });

        // Player (The Orange)
        ctx.save();
        ctx.translate(player.x + 15, player.y + 17);
        ctx.rotate(player.dy * 0.05);
        ctx.fillStyle = "#ff8c00"; ctx.beginPath();
        ctx.ellipse(0, 0, 15, 17, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // Faders
        obstacles.forEach(obs => {
            ctx.fillStyle = "#111"; 
            ctx.fillRect(obs.x + 18, obs.y, 8, obs.height);
            ctx.fillStyle = "#ff4c4c";
            const knobY = (obs.type === 'top') ? obs.height - 20 : obs.y;
            ctx.fillRect(obs.x, knobY, obs.width, 20);
        });
    }

    function startGame() {
        resize();
        score = 0; obstacles = []; coins = []; 
        pluginsSpawned = 0; pluginsCollected = 0;
        lastSpawnTime = Date.now(); waveOffset = 0;
        gameActive = true;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        updateUI();
        update(); 
    }

    function endGame(msg) {
        gameActive = false;
        document.getElementById('status-message').innerText = msg;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalPlugins').innerText = `${pluginsCollected} / ${pluginsSpawned}`;
        document.getElementById('end-screen').style.display = 'block';
        cancelAnimationFrame(animationId);
    }

    // Controls
    const handleInput = (e) => {
        if (gameActive) {
            player.dy = player.lift;
        }
        e.preventDefault();
    };

    window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleInput(e); });
    window.addEventListener('touchstart', handleInput, { passive: false });
    window.addEventListener('resize', resize);
</script>
</body>
</html>
