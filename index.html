<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLappy Beat| DAW EDITION</title>
    <style>
        :root {
            --fl-orange: #ff8c00;
            --fl-bg: #2c3033;
            --fl-panel: #1e2225;
            --clipping: #ff4c4c;
            --vst-gold: #ffd700;
            --neon-glow: rgba(255, 140, 0, 0.6);
        }

        body { margin: 0; overflow: hidden; background: #121314; font-family: 'Segoe UI', sans-serif; color: white; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        canvas { 
            background: #2c3033; 
            border: 8px solid #1e2225;
            border-top: 25px solid #1e2225; 
            display: none; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); 
            border-radius: 4px;
        }
    

canvas {
    max-width: 100%; /* Ensures it doesn't bleed out on smaller screens */
    height: auto;
}

        #ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; display: none; background: #111; padding: 5px 20px; border-radius: 20px; border: 1px solid var(--fl-orange); color: var(--fl-orange); font-weight: bold; text-align: center; z-index: 20; }
        #menu, #end-screen { text-align: center; z-index: 10; background: #1e2225; padding: 40px; border-radius: 12px; border: 1px solid #444; min-width: 420px; }
        
        h1 { color: var(--fl-orange); text-transform: uppercase; letter-spacing: 5px; font-style: italic; margin-bottom: 5px; }
        .stat-box { background: #111; padding: 20px; border-radius: 8px; margin: 15px 0; border-top: 2px solid var(--fl-orange); }
        
        button { padding: 12px 30px; background: #3b3f43; color: white; border: 1px solid #555; border-radius: 3px; font-weight: bold; cursor: pointer; margin: 5px; text-transform: uppercase; }
        button:hover { background: var(--fl-orange); color: #000; }
        
        input { padding: 15px; background: #000; border: 1px solid #555; color: var(--fl-orange); text-align: center; margin-bottom: 15px; width: 80%; font-family: monospace; font-size: 18px; outline: none; border-radius: 4px; }
        
        #leaderboard-list { list-style: none; padding: 0; color: var(--fl-orange); font-family: monospace; text-align: left; margin: 20px 0; border: 1px solid #333; background: #111; border-radius: 5px; }
        #leaderboard-list li { padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        
        .promo-code { color: #fff; background: #4caf50; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 10px; display: none; border: 2px dashed #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>FLappy Beat</h1>
        <p style="color: #888;">COLLECT ALL VST'S FOR A SURPRISE</p>
        <button onclick="startGame()">OPEN PROJECT</button>
    </div>

    <div id="ui">
        MASTER OUTPUT: <span id="score">0</span> LUFS<br>
        <small style="color: var(--vst-gold);">PLUGINS LOADED: <span id="pluginCount">0/0</span></small>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="end-screen" style="display:none;">
        <h1 id="status-message">PROJECT CRASHED</h1>
        
        <div id="score-submission">
            <div class="stat-box">
                <p style="font-size: 20px; margin: 5px 0;">FINAL LUFS: <span id="finalScore">0</span></p>
                <p style="font-size: 18px; color: var(--vst-gold); margin: 10px 0;">PLUGINS ACQUIRED: <span id="finalPlugins">0 / 0</span></p>
                <div id="reward-box" class="promo-code">
                    CONGRATS! You opened all the VST's!<br>
                    Enjoy 10% Off your entire order!<br>
                    USE CODE: <span style="font-size: 22px;">FLappy10</span>
                </div>
            </div>
            <input type="text" id="playerName" placeholder="ENTER PRODUCER NAME..." maxlength="15">
            <br>
            <button onclick="saveScore()">SAVE TO MASTER LIST</button>
        </div>

        <div id="leaderboard-section" style="display:none;">
            <h3>TOP PRODUCERS</h3>
            <ul id="leaderboard-list"></ul>
            <button onclick="backToMenu()">MAIN MENU</button>
            <button onclick="startGame()" style="background: var(--fl-orange); color: black;">RE-MIX</button>
        </div>
    </div>
</div>

<audio id="bgm" src="track.mp3" preload="auto"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgm = document.getElementById('bgm');
    
    const OBSTACLE_SPEED = 5; 
    const MIDI_SPEED = 3; 
    const SPAWN_INTERVAL = 1800; 
    const GATE_GAP = 185; 

    let score = 0, gameActive = false, isWaiting = false;
    let obstacles = [], coins = [], floatingTexts = [], midiNotes = [];
    let pluginsSpawned = 0, pluginsCollected = 0;
    let lastSpawnTime = 0, lastMidiTime = 0, animationId = null;
    let midiOffset = 0;
    
    const FEEDBACK_WORDS = ["SIDECHAINED", "PROCESSED", "QUANTIZED", "LIMITING", "NORMALIZED", "SAMPLING"];
    const player = { x: 150, y: 225, width: 32, height: 36, dy: 0, gravity: 0.35, lift: -7 };

    function initCanvas() {
        canvas.width = 850;
        canvas.height = 500;
        player.y = canvas.height / 2;
        player.dy = 0;
    }

    function startGame() {
        if (animationId) cancelAnimationFrame(animationId);
        score = 0; obstacles = []; coins = []; floatingTexts = []; midiNotes = [];
        pluginsSpawned = 0; pluginsCollected = 0;
        lastSpawnTime = 0; lastMidiTime = 0; midiOffset = 0;
        
        gameActive = true;
        isWaiting = true; 

        document.getElementById('menu').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('reward-box').style.display = 'none';
        document.getElementById('score-submission').style.display = 'block';
        document.getElementById('leaderboard-section').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        
        updateUI();
        initCanvas();
        update(); 
    }

    function startAudio() {
        isWaiting = false;
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("Audio Error:", e));
    }

    function addFloatingText(x, y, text, isGold = false) {
        let targetY = y;
        floatingTexts.forEach(ft => {
            if (Math.abs(ft.y - targetY) < 25) {
                targetY -= 30; 
            }
        });

        floatingTexts.push({
            x: x,
            y: targetY,
            text: text,
            life: 1.0,
            isGold: isGold,
            scale: 0.5, 
            velocity: -1.2
        });
    }

    function spawnGate() {
        const minH = 60, maxH = canvas.height - GATE_GAP - minH;
        const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;

        obstacles.push({ x: canvas.width, y: 0, w: 50, h: topH, passed: false, type: 'top' });
        obstacles.push({ x: canvas.width, y: topH + GATE_GAP, w: 50, h: canvas.height - (topH + GATE_GAP), passed: false, type: 'bottom' });
        coins.push({ x: canvas.width + 15, y: topH + (GATE_GAP/2) - 10, size: 20, collected: false });
        pluginsSpawned++;
        updateUI();
    }

    function spawnMidiNote() {
        const lane = Math.floor(Math.random() * 6);
        const length = 40 + Math.random() * 100;
        const color = Math.random() > 0.5 ? '#4caf5044' : '#2196f344';
        midiNotes.push({ x: canvas.width, y: lane * 85 + 20, w: length, h: 25, color: color });
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;
    }

    function update() {
        if (!gameActive) return;

        if (bgm.ended && !isWaiting && coins.length === 0) {
            endGame("TRACK RENDERED");
            return;
        }

        if (!isWaiting) {
            let now = Date.now();
            
            if (!bgm.ended && now - lastSpawnTime > SPAWN_INTERVAL) {
                spawnGate();
                lastSpawnTime = now;
            }

            if (!bgm.ended && now - lastMidiTime > 400) {
                spawnMidiNote();
                lastMidiTime = now;
            }

            player.dy += player.gravity;
            player.y += player.dy;
            midiOffset += MIDI_SPEED;

            if (player.y < 0 || player.y + player.height > canvas.height) endGame("CLIPPING ERROR");

            for (let i = midiNotes.length - 1; i >= 0; i--) {
                midiNotes[i].x -= MIDI_SPEED;
                if (midiNotes[i].x + midiNotes[i].w < -50) midiNotes.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= OBSTACLE_SPEED;
                if (player.x + 4 < obs.x + obs.w && player.x + player.width - 4 > obs.x &&
                    player.y + 4 < obs.y + obs.h && player.y + player.height - 4 > obs.y) {
                    endGame("BUFFER OVERFLOW");
                }
                if (!obs.passed && obs.x < player.x && obs.type === 'top') {
                    obs.passed = true; score += 100; updateUI();
                    addFloatingText(player.x, player.y - 15, FEEDBACK_WORDS[Math.floor(Math.random() * FEEDBACK_WORDS.length)], false);
                }
                if (obs.x + obs.w < -100) obstacles.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.x -= OBSTACLE_SPEED;
                if (!c.collected && player.x < c.x + c.size && player.x + player.width > c.x &&
                    player.y < c.y + c.size && player.y + player.height > c.y) {
                    c.collected = true; score += 1000; pluginsCollected++; updateUI();
                    addFloatingText(player.x, player.y - 15, "VST LOADED", true);
                    coins.splice(i, 1);
                }
                if (c.x < -100) coins.splice(i, 1);
            }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.velocity;
            ft.life -= 0.015;
            if (ft.scale < 1.1) ft.scale += 0.1; 
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for(let i = 0; i < 6; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#33373a' : '#2c3033';
            ctx.fillRect(0, i * 85, canvas.width, 85);
        }

        ctx.strokeStyle = '#3d4144';
        let gridShift = midiOffset % 80;
        for(let i = -gridShift; i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        midiNotes.forEach(m => {
            ctx.fillStyle = m.color;
            ctx.fillRect(m.x, m.y, m.w, m.h);
        });

        coins.forEach(c => {
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.moveTo(c.x + c.size/2, c.y);
            ctx.lineTo(c.x + c.size, c.y + c.size/2);
            ctx.lineTo(c.x + c.size/2, c.y + c.size);
            ctx.lineTo(c.x, c.y + c.size/2);
            ctx.fill();
        });

        obstacles.forEach(obs => {
            ctx.fillStyle = "#1e2225"; ctx.fillRect(obs.x + 18, obs.y, 14, obs.h);
            ctx.fillStyle = "#111"; ctx.fillRect(obs.x + 23, obs.y, 4, obs.h);
            ctx.fillStyle = "#ff4c4c"; 
            const kY = (obs.type === 'top') ? obs.h - 22 : obs.y;
            ctx.fillRect(obs.x, kY, obs.w, 22);
        });

        ctx.save();
        ctx.translate(player.x + 16, player.y + 18); ctx.rotate(player.dy * 0.05);
        ctx.fillStyle = "#ff8c00"; ctx.beginPath(); ctx.ellipse(0, 0, 16, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4caf50"; ctx.beginPath(); ctx.ellipse(5, -14, 9, 4, -0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        if (isWaiting) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff8c00";
            ctx.font = "bold 24px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("FLappy Beat (beta)", canvas.width/2, canvas.height/2 - 20);
            ctx.fillStyle = "white";
            ctx.font = "16px 'Segoe UI'";
            ctx.fillText("Avoid the clipping mixer tracks", canvas.width/2, canvas.height/2 + 20);
            ctx.textAlign = "left"; 
        }

        floatingTexts.forEach(ft => {
            ctx.save();
            ctx.globalAlpha = ft.life;
            ctx.translate(ft.x, ft.y);
            ctx.scale(ft.scale, ft.scale);
            ctx.shadowBlur = 10;
            ctx.shadowColor = ft.isGold ? "rgba(255, 215, 0, 0.8)" : "rgba(255, 140, 0, 0.8)";
            ctx.fillStyle = ft.isGold ? "#ffd700" : "#ff8c00";
            ctx.font = "italic bold 18px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText(ft.text, 0, 0);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 0.5;
            ctx.strokeText(ft.text, 0, 0);
            ctx.restore();
        });
    }

    function endGame(msg) {
        gameActive = false; 
        bgm.pause();
        document.getElementById('status-message').innerText = msg;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalPlugins').innerText = `${pluginsCollected} / ${pluginsSpawned}`;
        
        if (msg === "TRACK RENDERED" && pluginsCollected === pluginsSpawned && pluginsSpawned > 0) {
            document.getElementById('reward-box').style.display = 'block';
        }

        document.getElementById('end-screen').style.display = 'block';
    }

    function saveScore() {
        const nameInput = document.getElementById('playerName');
        const name = nameInput.value.toUpperCase() || "PRODUCER";
        let board = JSON.parse(localStorage.getItem('PBP_Scores')) || [];
        board.push({ name: name, score: score });
        board.sort((a,b) => b.score - a.score);
        localStorage.setItem('PBP_Scores', JSON.stringify(board.slice(0,5)));
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = board.slice(0,5).map(e => `<li><span>${e.name}</span> <span>${e.score} LUFS</span></li>`).join('');
        document.getElementById('score-submission').style.display = 'none';
        document.getElementById('leaderboard-section').style.display = 'block';
        nameInput.value = "";
    }

    function backToMenu() { 
        document.getElementById('end-screen').style.display = 'none'; 
        canvas.style.display = 'none'; 
        document.getElementById('menu').style.display = 'block'; 
    }
    
            function handleInput(e) {
    if (isWaiting) startAudio();

    if (gameActive) {
        player.dy = player.lift;
    }

    if (e) e.preventDefault();
}

// Keyboard (keep spacebar)
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') handleInput(e);
});

// Mouse click
window.addEventListener('mousedown', handleInput);

// Touch (mobile)
window.addEventListener('touchstart', handleInput);

// Pointer (covers most modern devices)
window.addEventListener('pointerdown', handleInput);
</script>
</body>
</html>
