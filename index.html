<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT RUNNER | DAW EDITION</title>
    <style>
        :root {
            --fl-orange: #ff8c00;
            --fl-bg: #2c3033;
            --fl-panel: #1e2225;
            --fl-grid: #3d4144;
            --fl-midi: #4a4f54;
            --clipping: #ff4c4c;
            --vst-gold: #ffd700;
            --track-vol: #111;
        }

        body { margin: 0; overflow: hidden; background: #121314; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* The DAW Window Border */
        canvas { 
            background: var(--fl-bg); 
            border: 8px solid var(--fl-panel);
            border-top: 25px solid var(--fl-panel); 
            display: none; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); 
            border-radius: 4px;
        }

        #ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; display: none; background: #111; padding: 5px 20px; border-radius: 20px; border: 1px solid var(--fl-orange); color: var(--fl-orange); font-weight: bold; text-align: center; z-index: 20; }
        #menu, #end-screen { text-align: center; z-index: 10; background: var(--fl-panel); padding: 50px; border-radius: 12px; border: 1px solid #444; min-width: 400px; }
        h1 { color: var(--fl-orange); text-transform: uppercase; letter-spacing: 5px; font-style: italic; }
        .stat-box { background: #111; padding: 20px; border-radius: 8px; margin: 15px 0; border-top: 2px solid var(--fl-orange); }
        
        button { padding: 12px 35px; background: #3b3f43; color: white; border: 1px solid #555; border-radius: 3px; font-weight: bold; cursor: pointer; margin: 10px; text-transform: uppercase; transition: all 0.2s; }
        button:hover { background: var(--fl-orange); color: #000; }
        
        input { padding: 12px; background: #000; border: 1px solid #333; color: var(--fl-orange); text-align: center; margin-bottom: 15px; width: 200px; font-family: monospace; outline: none; }
        input:focus { border-color: var(--fl-orange); }
        
        #leaderboard-list { list-style: none; padding: 0; color: var(--fl-orange); font-family: monospace; text-align: left; max-width: 300px; margin: 20px auto; }
        #leaderboard-list li { padding: 5px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>GAIN STAGE</h1>
        <p>POWERED BY PRODUCERS v2.0.5 (DAW)</p>
        <button onclick="startGame()">RENDER PROJECT</button>
    </div>

    <div id="ui">
        MASTER OUTPUT: <span id="score">0</span> dB<br>
        <small style="color: var(--vst-gold);">PLUGINS LOADED: <span id="pluginCount">0/0</span></small>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="end-screen" style="display:none;">
        <h1 id="status-message">PROJECT CRASHED</h1>
        
        <div id="score-submission">
            <div class="stat-box">
                <p id="final-stats" style="font-size: 20px; margin: 5px 0;">FINAL PEAK: <span id="finalScore">0</span></p>
                <p style="font-size: 18px; color: var(--vst-gold); margin: 10px 0;">PLUGINS ACQUIRED: <span id="finalPlugins">0 / 0</span></p>
            </div>
            <input type="text" id="playerName" placeholder="PRODUCER_NAME">
            <br>
            <button onclick="saveScore()">EXPORT TO CLOUD</button>
        </div>

        <div id="leaderboard-section" style="display:none;">
            <h3>TOP PRODUCERS</h3>
            <ul id="leaderboard-list"></ul>
            <button onclick="backToMenu()">EXIT</button>
        </div>
        
        <br>
        <button id="quick-play-btn" onclick="startGame()" style="background: var(--fl-orange); color: black;">RE-MIX</button>
    </div>
</div>

<audio id="bgm" src="track.mp3" preload="auto"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgm = document.getElementById('bgm');
    
    // Mechanics
    const OBSTACLE_SPEED = 5; 
    const SPAWN_INTERVAL = 1800; 
    const GATE_GAP = 185; 

    // Game State
    let score = 0, gameActive = false, obstacles = [], coins = [], floatingTexts = [];
    let pluginsSpawned = 0, pluginsCollected = 0;
    let lastSpawnTime = 0, animationId = null;
    let waveOffset = 0, midiOffset = 0;
    
    // DAW Feedback
    const FEEDBACK_WORDS = ["SIDECHAINED", "PROCESSED", "QUANTIZED", "LIMITING", "NORMALIZED", "SAMPLING"];

    // Character (The Orange)
    const player = { x: 150, y: 225, width: 32, height: 36, dy: 0, gravity: 0.35, lift: -7 };

    function initCanvas() {
        canvas.width = 850;
        canvas.height = 500;
        player.y = canvas.height / 2;
        player.dy = 0;
    }

    function startGame() {
        if (animationId) cancelAnimationFrame(animationId);
        score = 0; obstacles = []; coins = []; floatingTexts = []; 
        pluginsSpawned = 0; pluginsCollected = 0;
        lastSpawnTime = 0; waveOffset = 0; midiOffset = 0;
        gameActive = true;

        document.getElementById('menu').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('score-submission').style.display = 'block';
        document.getElementById('leaderboard-section').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        canvas.style.display = 'block';
        
        updateUI();
        initCanvas();

        bgm.currentTime = 0;
        bgm.play().catch(() => console.log("Manual Start Required"));

        update(); 
    }

    function spawnGate() {
        const minGateHeight = 50;
        const maxGateHeight = canvas.height - GATE_GAP - minGateHeight;
        const topHeight = Math.floor(Math.random() * (maxGateHeight - minGateHeight + 1)) + minGateHeight;

        // Obstacles now look like Mixer Tracks
        obstacles.push({ x: canvas.width, y: 0, width: 50, height: topHeight, passed: false, type: 'top' });
        obstacles.push({ x: canvas.width, y: topHeight + GATE_GAP, width: 50, height: canvas.height - (topHeight + GATE_GAP), passed: false, type: 'bottom' });

        // VST Icon (The coin)
        coins.push({ x: canvas.width + 15, y: topHeight + (GATE_GAP/2) - 10, size: 20, collected: false });
        pluginsSpawned++;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('pluginCount').innerText = `${pluginsCollected}/${pluginsSpawned}`;
    }

    function update() {
        if (!gameActive) return;
        if (bgm.src !== "" && bgm.ended) { endGame("TRACK RENDERED"); return; }

        let now = Date.now();
        if (now - lastSpawnTime > SPAWN_INTERVAL) {
            spawnGate();
            lastSpawnTime = now;
        }

        // Physics
        player.dy += player.gravity;
        player.y += player.dy;
        waveOffset += OBSTACLE_SPEED;
        midiOffset += OBSTACLE_SPEED * 0.5; // Background moves slower for parallax

        // Clipping Check (Boundaries)
        if (player.y < 0 || player.y + player.height > canvas.height) endGame("PROJECT CRASHED");

        // Fader (Obstacle) Collision
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= OBSTACLE_SPEED;
            
            // Tight hitboxes for fair gameplay (Fader handle only)
            if (player.x + 4 < obs.x + obs.width && player.x + player.width - 4 > obs.x &&
                player.y + 4 < obs.y + obs.height && player.y + player.height - 4 > obs.y) {
                endGame("PROJECT CRASHED");
            }

            // Clearing the Mixer Track
            if (!obs.passed && obs.x < player.x && obs.type === 'top') {
                obs.passed = true; score += 100; updateUI();
                floatingTexts.push({ x: player.x, y: player.y - 20, text: FEEDBACK_WORDS[Math.floor(Math.random() * FEEDBACK_WORDS.length)], life: 1.0 });
            }
            if (obs.x + obs.width < -100) obstacles.splice(i, 1);
        }

        // VST Collection
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.x -= OBSTACLE_SPEED;
            if (!c.collected && player.x < c.x + c.size && player.x + player.width > c.x &&
                player.y < c.y + c.size && player.y + player.height > c.y) {
                c.collected = true; score += 1000; pluginsCollected++; updateUI();
                floatingTexts.push({ x: player.x, y: player.y - 10, text: "PLUG-IN OPENED", life: 1.0, color: '#ffd700' });
                coins.splice(i, 1);
            }
            if (c.x < -100) coins.splice(i, 1);
        }

        // Text Decay
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].y -= 1; floatingTexts[i].life -= 0.02;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // --- DRAWING THE FL PLAYLIST BACKGROUND ---
        // Playlist Grid
        ctx.strokeStyle = var('--fl-grid'); ctx.lineWidth = 1;
        let gridShift = midiOffset % 80;
        for(let i = -gridShift; i < canvas.width; i += 80) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        
        // Dynamic Playlist lanes
        for(let i = 0; i < 6; i++) {
            ctx.fillStyle = (i % 2 === 0) ? 'rgba(61, 65, 68, 0.3)' : 'rgba(44, 48, 51, 0.3)';
            ctx.fillRect(0, i * 85, canvas.width, 85);
        }
        
        // Moving Midi Blocks (Parallax background)
        ctx.fillStyle = var('--fl-midi');
        for(let i = 0; i < 4; i++) {
            let blockX = (1000 - ((midiOffset * (0.8 + i*0.1)) % 1200));
            ctx.fillRect(blockX, 50 + (i*110), 180, 40);
            ctx.fillStyle = i % 2 === 0 ? '#4caf50aa' : '#2196f3aa'; // Give them Midi Clip colors
            ctx.fillRect(blockX + 5, 50 + (i*110) + 5, 170, 30);
            ctx.fillStyle = var('--fl-midi'); // Reset for next loop
        }
        
        // Automation Clip Curve (Background decoration)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 140, 0, 0.1)';
        ctx.lineWidth = 2;
        for (let i = 0; i < canvas.width; i+=10) {
            let waveY = Math.sin((i + waveOffset) * 0.015) * 50 + (canvas.height / 2);
            if (i === 0) ctx.moveTo(i, waveY); else ctx.lineTo(i, waveY);
        }
        ctx.stroke();


        // --- DRAWING COLLECTIBLES (VSTs) ---
        coins.forEach(c => {
            // Gold Pulse Effect
            let pulse = Math.sin(Date.now() * 0.01) * 3;
            ctx.fillStyle = var('--vst-gold');
            ctx.shadowBlur = 15; ctx.shadowColor = var('--vst-gold');
            // The vintage star/diamond VST shape
            ctx.beginPath();
            ctx.moveTo(c.x + c.size/2, c.y + pulse);
            ctx.lineTo(c.x + c.size + pulse, c.y + c.size/2);
            ctx.lineTo(c.x + c.size/2, c.y + c.size + pulse);
            ctx.lineTo(c.x - pulse, c.y + c.size/2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // --- DRAWING OBSTACLES (Mixer Tracks) ---
        obstacles.forEach(obs => {
            // Dark Mixer Track Fader Strip
            ctx.fillStyle = "#1e2225"; 
            ctx.fillRect(obs.x + 18, obs.y, 14, obs.height);
            ctx.fillStyle = "#111"; // The Fader line
            ctx.fillRect(obs.x + 23, obs.y, 4, obs.height);

            // The Fader Knob (Red, indicating Clipping)
            ctx.fillStyle = var('--clipping'); 
            const knobY = (obs.type === 'top') ? obs.height - 22 : obs.y;
            // Draw a detailed fader knob
            ctx.fillRect(obs.x + 5, knobY, obs.width - 10, 22);
            ctx.fillStyle = "rgba(0,0,0,0.5)"; // Fader indicator line
            ctx.fillRect(obs.x + 10, knobY + 10, obs.width - 20, 2);
        });

        // --- DRAWING CHARACTER (THE ORANGE) ---
        ctx.save();
        ctx.translate(player.x + 16, player.y + 18); ctx.rotate(player.dy * 0.05);
        ctx.fillStyle = "#ff8c00"; ctx.beginPath(); ctx.ellipse(0, 0, 16, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#4caf50"; ctx.beginPath(); ctx.ellipse(5, -14, 9, 4, -0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // --- DRAWING UI TEXT ---
        floatingTexts.forEach(ft => {
            ctx.font = "bold 13px 'Segoe UI'"; 
            ctx.fillStyle = `rgba(${ft.color === '#ffd700' ? '255, 215, 0' : '255, 255, 255'}, ${ft.life})`;
            ctx.fillText(ft.text, ft.x, ft.y);
        });
    }

    // --- GAME ENGINE & UI FUNCTIONS ---
    function endGame(msg) {
        gameActive = false; bgm.pause();
        document.getElementById('status-message').innerText = msg;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalPlugins').innerText = `${pluginsCollected} / ${pluginsSpawned}`;
        document.getElementById('end-screen').style.display = 'block';
    }

    function saveScore() {
        const name = document.getElementById('playerName').value || "PRODUCER";
        let board = JSON.parse(localStorage.getItem('beatRunnerScores')) || [];
        board.push({ name: name, score: score });
        board.sort((a,b) => b.score - a.score);
        localStorage.setItem('beatRunnerScores', JSON.stringify(board.slice(0,5)));
        const list = document.getElementById('leaderboard-list');
        list.innerHTML = board.slice(0,5).map(e => `<li>${e.name.toUpperCase()} >> ${e.score} dB PEAK</li>`).join('');
        document.getElementById('score-submission').style.display = 'none';
        document.getElementById('leaderboard-section').style.display = 'block';
    }

    function backToMenu() { 
        document.getElementById('end-screen').style.display = 'none'; 
        canvas.style.display = 'none'; 
        document.getElementById('menu').style.display = 'block'; 
    }

    function var(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (gameActive) {
                player.dy = player.lift;
                e.preventDefault();
            }
        }
    });
</script>
</body>
</html>
